<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactile Dictator Handwriting Practice Tool</title>
    <style>
        body { font-family: 'Arial', sans-serif; }
        #container { width: 80%; margin: auto; text-align: center; }
        #timer { font-size: 2rem; margin-top: 20px; }
        #import { margin: 20px; }
    </style>
</head>
<body>
    <div id="container">
        <h1>Tactile Dictator Handwriting Practice Tool</h1>
        <button id="startButton">Start Practice</button>
        <button id="import">Import</button>
        <div id="timer">Time Left: <span id="time">60</span> seconds</div>
    </div>
    <script>
        let countdown; // Timer variable
        let totalTime = 60; // Total time for the countdown

        document.getElementById('startButton').onclick = function() {
            startPractice();
        };

        function startPractice() {
            speakText("Write the following letters: A, B, C, D, E");
            startCountdown(totalTime);
        }

        function speakText(text) {
            const speech = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(speech);
        }

        function startCountdown(seconds) {
            let timeLeft = seconds;
            document.getElementById('time').innerText = timeLeft;
            countdown = setInterval(function() {
                timeLeft--;
                document.getElementById('time').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    alert("Time's up!");
                }
            }, 1000);
        }

        document.getElementById('import').onclick = function() {
            importData();
        };

        function importData() {
            // Logic to handle import feature
            const input = prompt("Enter data to import:");
            if (input) {
                alert(`Imported: ${input}`);
                speakText(`You have imported: ${input}`);
            }
        }

        // Keyboard shortcuts for actions
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                startPractice();
            }
        });
    </script>
</body>
</html>
